<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folio</title>
  </head>
  <body>
    <div id="welcome" hidden>
      <div class="welcome-box">
        <div class="logo">Folio</div>
        <p>A live-preview editor for Quarto books.</p>
        <button id="welcome-open" class="primary">Open a Quarto project…</button>
        <p class="hint">Open the folder that contains <code>_quarto.yml</code>.</p>
      </div>
    </div>

    <div id="app" hidden>
      <aside id="sidebar">
        <header>
          <div class="book-head">
            <div>
              <div id="book-title"></div>
              <div id="book-author"></div>
            </div>
            <button id="new-file" class="icon" title="New document">＋</button>
          </div>
        </header>
        <nav id="outline" tabindex="0" aria-label="Files"></nav>
        <footer>
          <button id="open-folder" title="Open project (⌘O)">Open…</button>
          <button id="quick-open" title="Go to file (⌘P)">Go to file ⌘P</button>
          <button id="edit-config" class="icon-btn" title="Project settings (_quarto.yml)" aria-label="Project settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8l1.6 2.3 2.7-.6.9 2.6 2.6.9-.6 2.7 2.3 1.6-2.3 1.6.6 2.7-2.6.9-.9 2.6-2.7-.6L12 21.2l-1.6-2.3-2.7.6-.9-2.6-2.6-.9.6-2.7L2.5 12l2.3-1.6-.6-2.7 2.6-.9.9-2.6 2.7.6z"/></svg>
          </button>
        </footer>
      </aside>
      <div id="sidebar-resizer" title="Drag to resize · double-click to reset"></div>

      <main>
        <div id="toolbar">
          <button id="toggle-sidebar" class="icon" title="Toggle sidebar (⌘\)">☰</button>
          <div id="crumb"></div>
          <div class="spacer"></div>
          <button id="render-chapter" title="quarto render this chapter (⇧⌘R)">Render chapter</button>
          <button id="render-book" title="quarto render the whole project">Render book</button>
          <button id="export-pdf" title="Export PDF with Quarto (whole book for book projects)">Export PDF</button>
          <span class="sep"></span>
          <div id="view-switch" class="seg" role="group" aria-label="View mode">
            <button data-mode="edit" title="Edit — live preview (⌘1)" aria-label="Edit">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.6 2.4l3 3L5.5 13.5 2 14l.5-3.5z"/><path d="M9.3 3.7l3 3"/></svg>
            </button>
            <button data-mode="source" title="Source — plain .qmd text (⌘2)" aria-label="Source">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4.5L2 8l3.5 3.5"/><path d="M10.5 4.5L14 8l-3.5 3.5"/><path d="M9 3l-2 10"/></svg>
            </button>
            <button data-mode="reader" title="Reader — read-only, like the book (⌘3)" aria-label="Reader">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4.2C6.6 3.2 4.6 2.8 2 3v9.3c2.6-.2 4.6.2 6 1.2 1.4-1 3.4-1.4 6-1.2V3c-2.6-.2-4.6.2-6 1.2z"/><path d="M8 4.2v9.3"/></svg>
            </button>
          </div>
          <button id="toggle-lines" class="icon-btn" title="Line numbers (⌘⇧L)" aria-label="Line numbers" aria-pressed="false">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h1.5v4"/><path d="M2.5 7.5h3"/><path d="M2.5 10.5c.4-.8 2.8-.9 2.8.4 0 1.1-2.8 1.5-2.8 2.6h3"/><path d="M8 4h6M8 8h6M8 12h6"/></svg>
          </button>
          <button id="toggle-scm" class="icon-btn" title="Source control (⌘⇧G)" aria-label="Source control" aria-pressed="false">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="4.5" cy="3.5" r="1.6"/><circle cx="4.5" cy="12.5" r="1.6"/><circle cx="11.5" cy="5.5" r="1.6"/><path d="M4.5 5.1v5.8"/><path d="M11.5 7.1c0 2.6-2.4 3.1-5.6 4.4"/></svg><span id="scm-count" class="scm-count" hidden></span>
          </button>
          <span class="font-ctl">
            <button id="font-dec" class="icon" title="Smaller text (⌘−)">A−</button>
            <span id="font-size">16</span>
            <button id="font-inc" class="icon" title="Larger text (⌘+)">A+</button>
          </span>
          <button id="toggle-focus" class="icon" title="Focus mode">◐</button>
          <button id="toggle-theme" class="icon" title="Theme">☾</button>
        </div>
        <section id="start-panel" hidden></section>
        <div id="editor"></div>
        <section id="log-panel" hidden>
          <header><span id="log-title">Render</span><button id="log-close" class="icon">✕</button></header>
          <pre id="log"></pre>
        </section>
        <footer id="statusbar">
          <span id="save-status">Saved</span>
          <span class="spacer"></span>
          <button id="python-env" class="sb-python" title="Select the Python interpreter">
            <span id="kernel-status" data-state="idle" title="Jupyter kernel state">●</span>
            <span id="python-label">Python</span>
          </button>
          <button id="run-above" title="Run all cells above the cursor (⌘⌥↵)">Run above</button>
          <button id="run-all" title="Run all Python cells">Run all</button>
          <button id="kernel-interrupt" class="icon" title="Interrupt kernel">◼</button>
          <button id="kernel-restart" class="icon" title="Restart kernel">↻</button>
          <span class="sep"></span>
          <span id="word-count"></span>
        </footer>
      </main>
      <div id="scm-resizer" hidden title="Drag to resize · double-click to reset"></div>
      <aside id="scm-panel" hidden aria-label="Source control"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
