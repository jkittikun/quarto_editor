name: Build macOS app

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub release with this tag (e.g. v0.1.0) from the built commit; leave empty for a plain build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build universal app (Apple Silicon + Intel)
        run: npx tauri build --target universal-apple-darwin

      - name: Upload .dmg
        uses: actions/upload-artifact@v5
        with:
          name: Folio-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 14
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Folio ${{ inputs.release_tag || github.ref_name }}
          body_path: .github/releases/${{ inputs.release_tag || github.ref_name }}.md
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
