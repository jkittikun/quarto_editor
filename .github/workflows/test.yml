name: Tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Unit + end-to-end (with Quarto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python packages for the kernel
        run: pip install jupyter_client ipykernel pyyaml nbformat nbclient matplotlib pandas numpy

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Quarto renders the sample chapter on its own (diagnostic)
        run: |
          cp -r examples/book /tmp/book-check
          cd /tmp/book-check
          timeout 180 quarto render intro.qmd < /dev/null; echo "quarto exit=$?"
          ls -la _book | head

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload e2e failure screenshot
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-failure
          path: e2e-failure.png
          if-no-files-found: ignore

  rust:
    name: Rust backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build frontend (needed by tauri::generate_context!)
        run: npm ci && npm run build

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
